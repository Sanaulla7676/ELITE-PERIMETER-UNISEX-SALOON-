<text x="800" y="208" text-anchor="middle" class="wp">Primary intent: Unisex Salon in Ullal</text>
<text x="800" y="232" text-anchor="middle" class="wp">NAP · trust · main CTA · category links</text>
<rect x="1155" y="135" width="365" height="125" class="node"/>
