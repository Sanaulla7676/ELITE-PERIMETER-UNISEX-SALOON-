<path d="M800 403 V433 H190 V460" class="line"/><path d="M800 433 H500 V460" class="line"/><path d="M800 433 V460" class="line"/><path d="M800 433 H1120 V460" class="line"/><path d="M800 433 H1420 V460" class="line"/>
