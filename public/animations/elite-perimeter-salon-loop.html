  function portraitScene6(t) {

    if(appear>0){ctx.save();ctx.globalAlpha=appear;drawSalonEmblem(centerX,500,132,appear);const blur=lerp(10,0,appear);if(blur>.4)ctx.filter=`blur(${blur}px)`;text(BRAND.name,centerX,740,64,800,C.navy,'center','middle');ctx.filter='none';text(BRAND.descriptor,centerX,810,24,700,C.blue,'center','middle');ctx.restore();}

  function render(t) {
    ctx.save();ctx.clearRect(0,0,canvas.width,canvas.height);

    else {if(t<2.05)scene1(t);else if(t<4.1)scene2(t);else if(t<8.75)scene3(t);else if(t<12)scene4(t);else if(t<13.2)scene5(t);else scene6(t);}
    ctx.restore();

  // Keep the drawing buffer aligned with the responsive iframe on phone rotation.
  let lastRenderAt=0;
  function syncCanvasOrientation(){const nextPortrait=window.matchMedia('(max-width: 780px)').matches;if(nextPortrait===portrait)return;portrait=nextPortrait;canvas.width=portrait?PW:W;canvas.height=portrait?PH:H;lastRenderAt=0;render(elapsed);}
  window.addEventListener('resize',syncCanvasOrientation,{passive:true});

  // Seek API retained for compatibility with a frame renderer.
  window.seek = function(seconds) { const t=Math.max(0,Math.min(DURATION,Number(seconds)||0)); render(t); scrub.value=String(t); updateClock(t); };
  const reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let playing=false,last=performance.now(),elapsed=0,raf=0;
  function updateClock(t){const s=Math.floor(t);clock.textContent=`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')} / 00:15`;}
  function loop(now){if(!playing)return;const dt=Math.min((now-last)/1000,.06);last=now;elapsed+=dt;if(elapsed>DURATION)elapsed=0;const frameInterval=portrait?1000/30:1000/60;if(now-lastRenderAt>=frameInterval){render(elapsed);scrub.value=String(elapsed);updateClock(elapsed);lastRenderAt=now;}raf=requestAnimationFrame(loop);}
  function play(){playing=true;last=performance.now();lastRenderAt=0;playPause.textContent='Pause';cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);}
  function pause(){playing=false;playPause.textContent='Play';cancelAnimationFrame(raf);}
  playPause.addEventListener('click',()=>playing?pause():play());
  fullscreenButton.addEventListener('click', async () => {
    try {
      if (!document.fullscreenElement) {
        if (player.requestFullscreen) await player.requestFullscreen();
      } else if (document.exitFullscreen) {
        await document.exitFullscreen();
      }
    } catch (error) { console.warn('Fullscreen could not be enabled:', error); }
  });
  document.addEventListener('fullscreenchange', () => {
    fullscreenButton.textContent = document.fullscreenElement ? 'Exit Fullscreen' : 'Fullscreen';
    fullscreenButton.setAttribute('aria-label', document.fullscreenElement ? 'Exit fullscreen' : 'Enter fullscreen');
  });
  scrub.addEventListener('input',()=>{elapsed=Number(scrub.value);render(elapsed);updateClock(elapsed);});
  window.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target===document.body){e.preventDefault();playing?pause():play();}});
  render(reduceMotion?14.99:0);
  if(!reduceMotion)play();else playPause.textContent='Play';
})();
