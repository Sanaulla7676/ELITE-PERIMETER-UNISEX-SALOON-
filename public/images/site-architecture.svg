<text x="262" y="208" text-anchor="middle" class="wp">Beauty Parlour · reviews · photos · directions</text>
<text x="262" y="232" text-anchor="middle" class="wp">Accurate address, hours and service menu</text>
<rect x="590" y="135" width="420" height="125" class="dark"/>
