<path d="M810 877 V885 H235 V890" class="line"/><path d="M810 877 V890 H605" class="line"/><path d="M810 877 V890 H975" class="line"/><path d="M810 877 H1355 V890" class="line"/>
<text x="800" y="1080" text-anchor="middle" class="tiny">Technical foundation: crawlable links · metadata · canonical URLs · XML sitemap · robots.txt · BeautySalon schema · breadcrumbs · fast mobile pages</text>
<text x="800" y="1103" text-anchor="middle" class="tiny">*Botox Spa and Hyder Facial must be confirmed with the salon before indexation or public claims.</text>
