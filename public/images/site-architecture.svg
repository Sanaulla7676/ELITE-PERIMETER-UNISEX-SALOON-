<rect x="985" y="470" width="270" height="116" class="node"/><text x="1120" y="507" text-anchor="middle" class="h">Threading</text><text x="1120" y="535" text-anchor="middle" class="p">/services/threading/</text><text x="1120" y="560" text-anchor="middle" class="tiny">Eyebrow · upper lip · chin</text>
<rect x="1295" y="470" width="250" height="116" class="node"/><text x="1420" y="507" text-anchor="middle" class="h">Nail care</text><text x="1420" y="535" text-anchor="middle" class="p">/services/nails/</text><text x="1420" y="560" text-anchor="middle" class="tiny">Manicure · pedicure · spa</text>
