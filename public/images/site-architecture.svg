<text x="800" y="637" text-anchor="middle" class="h">Dedicated service landing pages · unique intent and useful original content</text>
<text x="800" y="665" text-anchor="middle" class="sub">Each service page: keyword-led title + H1 + opening sentence · service facts · process to confirm · FAQs · location · contact CTA</text>
<path d="M190 586 V705 H810 V728" class="line"/><path d="M500 586 V705" class="line"/><path d="M810 586 V728" class="line"/><path d="M1120 586 V705" class="line"/><path d="M1420 586 V705 H810" class="line"/>
<rect x="260" y="730" width="1100" height="110" class="node"/>
<text x="810" y="770" text-anchor="middle" class="h">28 service routes generated from the verified service catalogue</text>
