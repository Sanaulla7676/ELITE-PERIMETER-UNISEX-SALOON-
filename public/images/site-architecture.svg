<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 1600 1160">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbf7f0"/><stop offset="1" stop-color="#eee3d8"/></linearGradient>
  <linearGradient id="plum" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#59364c"/><stop offset="1" stop-color="#2d1b29"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#382335" flood-opacity=".12"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#a67e4e" stroke-width="1.4"/></marker>
  <style>
    .title{font:600 34px Georgia,serif;fill:#2d1b29}.sub{font:16px Arial,sans-serif;fill:#756872}.node{fill:#fffdf9;stroke:#d9cbbd;stroke-width:1.5;rx:14;filter:url(#shadow)}.dark{fill:url(#plum);stroke:#b18b57;stroke-width:1.6;rx:16;filter:url(#shadow)}.h{font:700 19px Arial,sans-serif;fill:#45283a}.p{font:14px Arial,sans-serif;fill:#70636b}.wh{font:700 20px Arial,sans-serif;fill:#fff}.wp{font:14px Arial,sans-serif;fill:#f0e7dc}.tiny{font:12px Arial,sans-serif;fill:#897a81}.line{stroke:#b28b57;stroke-width:2;fill:none;marker-end:url(#arrow)}.dash{stroke:#b28b57;stroke-width:1.7;stroke-dasharray:7 6;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<rect width="1600" height="1160" fill="url(#bg)"/>
<text x="800" y="62" text-anchor="middle" class="title">Elite Perimeter · Local SEO Website Architecture</text>
<text x="800" y="94" text-anchor="middle" class="sub">Service hub → category hubs → individual service landing pages → enquiry</text>
